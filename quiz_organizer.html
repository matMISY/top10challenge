<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Organizer Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input {
            display: none;
        }

        .file-input-label {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-input-label:hover {
            background: #2980b9;
        }

        .config-input-label {
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }

        .config-input-label:hover {
            background: #8e44ad;
        }

        .search-box {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 250px;
            font-size: 14px;
        }

        .filter-select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            background: white;
        }

        .export-btn {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .export-btn:hover {
            background: #229954;
        }

        .auto-fill-btn {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .auto-fill-btn:hover {
            background: #2980b9;
        }

        .auto-complete-btn {
            background: #17a2b8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .auto-complete-btn:hover {
            background: #138496;
        }

        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            flex: 1;
            min-width: 120px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .main-content {
            display: flex;
            gap: 20px;
        }

        .quiz-pool {
            width: 300px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .quiz-pool h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
        }

        .tiers-container {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .tiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .tier {
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            padding: 10px;
            background: #f8f9fa;
            min-height: 200px;
        }

        .tier-header {
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            padding: 5px;
            background: #ecf0f1;
            border-radius: 5px;
        }

        .tier-slots {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 160px;
        }

        .quiz-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            cursor: move;
            transition: all 0.2s;
            user-select: none;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .quiz-card.in-tier {
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .quiz-card.in-tier:hover .remove-btn {
            display: flex;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .quiz-card.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .quiz-card.highlight {
            border-color: #f39c12;
            background-color: #fff3cd;
        }

        .quiz-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #666;
        }

        .difficulty-badge {
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 10px;
        }

        .difficulty-1 { background: #27ae60; }
        .difficulty-2 { background: #2ecc71; }
        .difficulty-3 { background: #f39c12; }
        .difficulty-4 { background: #e67e22; }
        .difficulty-5 { background: #e74c3c; }
        .difficulty-6 { background: #9b59b6; }

        .theme-text {
            font-weight: 500;
            font-size: 10px;
        }

        .theme-buteurs { color: #e74c3c; }
        .theme-passeurs { color: #3498db; }
        .theme-transferts { color: #f39c12; }
        .theme-competitions { color: #9b59b6; }
        .theme-clubs { color: #27ae60; }
        .theme-records { color: #e67e22; }
        .theme-histoire { color: #34495e; }
        .theme-nations { color: #1abc9c; }
        .theme-divers { color: #95a5a6; }
        .theme-entraineurs { color: #8e44ad; }
        .theme-joueurs { color: #2ecc71; }
        .theme-stades { color: #d35400; }

        .tier.drop-zone {
            border-color: #3498db;
            background-color: #ebf3fd;
        }

        .empty-slot {
            height: 60px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #7f8c8d;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #27ae60;
            color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #e74c3c;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .quiz-pool {
                width: 100%;
                max-height: 300px;
            }
            
            .controls {
                justify-content: center;
            }
            
            .search-box {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quiz Organizer Tool</h1>
            <div class="controls">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" class="file-input" multiple accept=".json">
                    <label for="fileInput" class="file-input-label">Load Quiz Files</label>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="configInput" class="file-input" accept=".json">
                    <label for="configInput" class="config-input-label">Load Config</label>
                </div>
                <input type="text" id="searchBox" class="search-box" placeholder="Search quizzes...">
                <select id="difficultyFilter" class="filter-select">
                    <option value="">All Difficulties</option>
                    <option value="1">Difficulty 1</option>
                    <option value="2">Difficulty 2</option>
                    <option value="3">Difficulty 3</option>
                    <option value="4">Difficulty 4</option>
                    <option value="5">Difficulty 5</option>
                    <option value="6">Difficulty 6</option>
                </select>
                <select id="themeFilter" class="filter-select">
                    <option value="">All Themes</option>
                </select>
                <button id="exportBtn" class="export-btn">Export Configuration</button>
                <button id="autoFillBtn" class="auto-fill-btn">Auto-Fill</button>
                <button id="autoCompleteBtn" class="auto-complete-btn">Auto-Complete</button>
                <button id="clearBtn" class="clear-btn">Clear All</button>
            </div>
        </div>

        <div class="stats">
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number" id="totalQuizzes">0</div>
                    <div class="stat-label">Total Quizzes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="assignedQuizzes">0</div>
                    <div class="stat-label">Assigned</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="unassignedQuizzes">0</div>
                    <div class="stat-label">Unassigned</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="filledTiers">0</div>
                    <div class="stat-label">Filled Tiers</div>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">Loading quizzes...</div>

        <div class="main-content">
            <div class="quiz-pool">
                <h3>Quiz Pool</h3>
                <div id="quizPool"></div>
            </div>

            <div class="tiers-container">
                <div class="tiers-grid" id="tiersGrid"></div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        class QuizOrganizer {
            constructor() {
                this.quizzes = [];
                this.tiers = Array(96).fill().map((_, i) => ({
                    id: i + 1,
                    quizzes: []
                }));
                this.filteredQuizzes = [];
                this.themes = new Set();
                
                this.initializeEventListeners();
                this.renderTiers();
            }

            initializeEventListeners() {
                document.getElementById('fileInput').addEventListener('change', this.handleFileLoad.bind(this));
                document.getElementById('configInput').addEventListener('change', this.handleConfigLoad.bind(this));
                document.getElementById('searchBox').addEventListener('input', this.handleSearch.bind(this));
                document.getElementById('difficultyFilter').addEventListener('change', this.handleFilter.bind(this));
                document.getElementById('themeFilter').addEventListener('change', this.handleFilter.bind(this));
                document.getElementById('exportBtn').addEventListener('click', this.exportConfiguration.bind(this));
                document.getElementById('autoFillBtn').addEventListener('click', this.autoFill.bind(this));
                document.getElementById('autoCompleteBtn').addEventListener('click', this.autoComplete.bind(this));
                document.getElementById('clearBtn').addEventListener('click', this.clearAll.bind(this));
            }

            async handleFileLoad(event) {
                const files = event.target.files;
                if (files.length === 0) return;

                document.getElementById('loading').style.display = 'block';
                
                try {
                    const loadedQuizzes = [];
                    
                    for (const file of files) {
                        const text = await this.readFile(file);
                        const data = JSON.parse(text);
                        if (data.quizzes && Array.isArray(data.quizzes)) {
                            loadedQuizzes.push(...data.quizzes);
                        }
                    }
                    
                    // Assign unique internal IDs to handle potential duplicates
                    this.quizzes = loadedQuizzes.map((quiz, index) => ({
                        ...quiz,
                        internalId: `quiz_${index}`, // Unique ID for drag & drop
                        originalId: quiz.id, // Keep original ID for export
                        uniqueId: `${quiz.id}_${index}` // Unique ID based on ID + index position
                    }));
                    
                    this.extractThemes();
                    this.applyFilters(); // Initialize filteredQuizzes
                    this.renderQuizPool();
                    this.updateStats();
                    this.showNotification(`Loaded ${this.quizzes.length} quizzes from ${files.length} files`);
                    
                } catch (error) {
                    this.showNotification('Error loading files: ' + error.message, true);
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            }

            async handleConfigLoad(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (this.quizzes.length === 0) {
                    this.showNotification('Please load quiz files first before loading configuration', true);
                    event.target.value = '';
                    return;
                }

                try {
                    const text = await this.readFile(file);
                    const config = JSON.parse(text);
                    
                    if (!config.quiz_order || !Array.isArray(config.quiz_order)) {
                        throw new Error('Invalid configuration format. Expected quiz_order array.');
                    }

                    await this.applyConfiguration(config);
                    this.showNotification(`Loaded configuration with ${config.quiz_order.length} quiz assignments`);
                    
                } catch (error) {
                    this.showNotification('Error loading configuration: ' + error.message, true);
                } finally {
                    event.target.value = '';
                }
            }

            async applyConfiguration(config) {
                // Clear existing assignments
                this.tiers.forEach(tier => tier.quizzes = []);
                
                // Debug: Check what IDs we have
                console.log('Quiz unique IDs available:', this.quizzes.map(q => q.uniqueId));
                console.log('Config wants:', config.quiz_order.map(c => c.quiz_id));
                
                // Create a map of unique quiz IDs to quiz objects
                const quizMap = new Map();
                this.quizzes.forEach(quiz => {
                    quizMap.set(quiz.uniqueId, quiz);
                });
                
                console.log('Quiz map size:', quizMap.size, 'vs quizzes length:', this.quizzes.length);
                
                // Group assignments by tier
                const tierAssignments = new Map();
                let foundCount = 0;
                let notFoundCount = 0;
                
                config.quiz_order.forEach(assignment => {
                    const quiz = quizMap.get(assignment.quiz_id);
                    if (quiz) {
                        foundCount++;
                        if (!tierAssignments.has(assignment.tier)) {
                            tierAssignments.set(assignment.tier, []);
                        }
                        tierAssignments.get(assignment.tier).push({
                            quiz: quiz,
                            position: assignment.position
                        });
                    } else {
                        notFoundCount++;
                        console.warn(`Quiz with ID ${assignment.quiz_id} not found in loaded quizzes`);
                    }
                });
                
                console.log(`Config matching: ${foundCount} found, ${notFoundCount} not found`);
                
                // Apply assignments to tiers
                tierAssignments.forEach((assignments, tierId) => {
                    // Sort by position
                    assignments.sort((a, b) => a.position - b.position);
                    
                    if (tierId > 0 && tierId <= this.tiers.length) {
                        const tier = this.tiers[tierId - 1];
                        tier.quizzes = assignments.map(assignment => assignment.quiz);
                        
                        // Limit to 5 quizzes per tier
                        if (tier.quizzes.length > 5) {
                            tier.quizzes = tier.quizzes.slice(0, 5);
                            console.warn(`Tier ${tierId} had more than 5 quizzes, limited to first 5`);
                        }
                    }
                });
                
                // Update UI
                this.applyFilters(); // Reset filters and update filteredQuizzes
                this.renderTiers();
                this.renderQuizPool();
                this.updateStats();
                
                // Show statistics
                const totalAssigned = config.quiz_order.length;
                const matchedQuizzes = Array.from(tierAssignments.values()).flat().length;
                
                if (matchedQuizzes < totalAssigned) {
                    this.showNotification(
                        `Configuration applied: ${matchedQuizzes}/${totalAssigned} quizzes matched`,
                        matchedQuizzes === 0
                    );
                }
            }

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = e => reject(e);
                    reader.readAsText(file);
                });
            }

            extractThemes() {
                this.themes = new Set(this.quizzes.map(quiz => quiz.theme).filter(Boolean));
                this.renderThemeFilter();
            }

            renderThemeFilter() {
                const themeFilter = document.getElementById('themeFilter');
                themeFilter.innerHTML = '<option value="">All Themes</option>';
                
                Array.from(this.themes).sort().forEach(theme => {
                    const option = document.createElement('option');
                    option.value = theme;
                    option.textContent = theme;
                    themeFilter.appendChild(option);
                });
            }

            handleSearch() {
                this.applyFilters();
            }

            handleFilter() {
                this.applyFilters();
            }

            applyFilters() {
                const searchTerm = document.getElementById('searchBox').value.toLowerCase();
                const difficultyFilter = document.getElementById('difficultyFilter').value;
                const themeFilter = document.getElementById('themeFilter').value;

                this.filteredQuizzes = this.quizzes.filter(quiz => {
                    const matchesSearch = !searchTerm || quiz.title.toLowerCase().includes(searchTerm);
                    // Handle missing or invalid difficulty values
                    const quizDifficulty = quiz.difficulty && !isNaN(quiz.difficulty) && quiz.difficulty >= 1 && quiz.difficulty <= 6 ? quiz.difficulty.toString() : '1';
                    const matchesDifficulty = !difficultyFilter || quizDifficulty === difficultyFilter;
                    const matchesTheme = !themeFilter || quiz.theme === themeFilter;
                    
                    return matchesSearch && matchesDifficulty && matchesTheme;
                });

                this.renderQuizPool();
            }

            renderQuizPool() {
                const pool = document.getElementById('quizPool');
                pool.innerHTML = '';

                const unassignedQuizzes = this.getUnassignedQuizzes();
                
                // Check if any filters are active
                const searchTerm = document.getElementById('searchBox').value.toLowerCase();
                const difficultyFilter = document.getElementById('difficultyFilter').value;
                const themeFilter = document.getElementById('themeFilter').value;
                const hasActiveFilters = searchTerm || difficultyFilter || themeFilter;
                
                // If filters are active, show filtered unassigned quizzes, otherwise show all unassigned
                const quizzesToShow = hasActiveFilters ? 
                    this.filteredQuizzes.filter(quiz => unassignedQuizzes.some(uq => uq.internalId === quiz.internalId)) :
                    unassignedQuizzes;

                quizzesToShow.forEach(quiz => {
                    const card = this.createQuizCard(quiz);
                    pool.appendChild(card);
                });

                if (quizzesToShow.length === 0) {
                    const empty = document.createElement('div');
                    empty.textContent = 'No quizzes found';
                    empty.style.textAlign = 'center';
                    empty.style.color = '#95a5a6';
                    empty.style.padding = '20px';
                    pool.appendChild(empty);
                }
            }

            getUnassignedQuizzes() {
                const assignedIds = new Set();
                this.tiers.forEach(tier => {
                    tier.quizzes.forEach(quiz => assignedIds.add(quiz.internalId));
                });
                
                return this.quizzes.filter(quiz => !assignedIds.has(quiz.internalId));
            }

            getThemeClass(theme) {
                if (!theme) return '';
                
                // Normalize theme name to match CSS classes
                const normalizedTheme = theme.toLowerCase()
                    .replace(/[àáâãäå]/g, 'a')
                    .replace(/[èéêë]/g, 'e')
                    .replace(/[ìíîï]/g, 'i')
                    .replace(/[òóôõö]/g, 'o')
                    .replace(/[ùúûü]/g, 'u')
                    .replace(/[ýÿ]/g, 'y')
                    .replace(/[ç]/g, 'c')
                    .replace(/[ñ]/g, 'n')
                    .replace(/[^a-z0-9]/g, '');
                
                return `theme-${normalizedTheme}`;
            }

            createQuizCard(quiz) {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.draggable = true;
                card.dataset.quizId = quiz.internalId;

                const searchTerm = document.getElementById('searchBox').value.toLowerCase();
                if (searchTerm && quiz.title.toLowerCase().includes(searchTerm)) {
                    card.classList.add('highlight');
                }

                // Ensure difficulty is a valid number between 1-6, default to 1 if missing
                const difficulty = quiz.difficulty && !isNaN(quiz.difficulty) && quiz.difficulty >= 1 && quiz.difficulty <= 6 ? quiz.difficulty : 1;
                const themeClass = this.getThemeClass(quiz.theme);
                
                card.innerHTML = `
                    <div class="quiz-title">${quiz.title}</div>
                    <div class="quiz-meta">
                        <span class="difficulty-badge difficulty-${difficulty}">${difficulty}</span>
                        <span class="theme-text ${themeClass}">${quiz.theme || 'No theme'}</span>
                    </div>
                `;

                card.addEventListener('dragstart', this.handleDragStart.bind(this));
                card.addEventListener('dragend', this.handleDragEnd.bind(this));

                return card;
            }

            createTierQuizCard(quiz, tierId, position) {
                const card = document.createElement('div');
                card.className = 'quiz-card in-tier';
                card.draggable = true;
                card.dataset.quizId = quiz.internalId;
                card.dataset.tierId = tierId;
                card.dataset.position = position;

                const searchTerm = document.getElementById('searchBox').value.toLowerCase();
                if (searchTerm && quiz.title.toLowerCase().includes(searchTerm)) {
                    card.classList.add('highlight');
                }

                // Ensure difficulty is a valid number between 1-6, default to 1 if missing
                const difficulty = quiz.difficulty && !isNaN(quiz.difficulty) && quiz.difficulty >= 1 && quiz.difficulty <= 6 ? quiz.difficulty : 1;
                const themeClass = this.getThemeClass(quiz.theme);
                
                card.innerHTML = `
                    <div class="quiz-title">${quiz.title}</div>
                    <div class="quiz-meta">
                        <span class="difficulty-badge difficulty-${difficulty}">${difficulty}</span>
                        <span class="theme-text ${themeClass}">${quiz.theme || 'No theme'}</span>
                    </div>
                    <button class="remove-btn" onclick="event.preventDefault(); event.stopPropagation(); quizOrganizer.removeQuizFromTier('${quiz.internalId}', ${tierId})">×</button>
                `;

                card.addEventListener('dragstart', this.handleTierDragStart.bind(this));
                card.addEventListener('dragend', this.handleDragEnd.bind(this));

                return card;
            }

            renderTiers() {
                const tiersGrid = document.getElementById('tiersGrid');
                tiersGrid.innerHTML = '';

                this.tiers.forEach(tier => {
                    const tierElement = document.createElement('div');
                    tierElement.className = 'tier';
                    tierElement.dataset.tierId = tier.id;

                    const header = document.createElement('div');
                    header.className = 'tier-header';
                    header.textContent = `Tier ${tier.id}`;

                    const slots = document.createElement('div');
                    slots.className = 'tier-slots';

                    // Add existing quizzes
                    tier.quizzes.forEach((quiz, index) => {
                        const card = this.createTierQuizCard(quiz, tier.id, index);
                        slots.appendChild(card);
                    });

                    // Add empty slots with drop functionality
                    const emptySlots = 5 - tier.quizzes.length;
                    for (let i = 0; i < emptySlots; i++) {
                        const emptySlot = document.createElement('div');
                        emptySlot.className = 'empty-slot';
                        emptySlot.textContent = 'Drop quiz here';
                        emptySlot.dataset.tierId = tier.id;
                        emptySlot.dataset.position = tier.quizzes.length + i;
                        
                        // Add drop event listeners to empty slots
                        emptySlot.addEventListener('dragover', this.handleDragOver.bind(this));
                        emptySlot.addEventListener('drop', this.handleSlotDrop.bind(this));
                        emptySlot.addEventListener('dragenter', (e) => {
                            e.preventDefault();
                            emptySlot.style.backgroundColor = '#ebf3fd';
                        });
                        emptySlot.addEventListener('dragleave', (e) => {
                            e.preventDefault();
                            emptySlot.style.backgroundColor = '';
                        });
                        
                        slots.appendChild(emptySlot);
                    }

                    // Add drop listeners to the slots container for internal reordering
                    slots.addEventListener('dragover', this.handleDragOver.bind(this));
                    slots.addEventListener('drop', this.handleInternalDrop.bind(this));

                    tierElement.appendChild(header);
                    tierElement.appendChild(slots);

                    // Add drop event listeners
                    tierElement.addEventListener('dragover', this.handleDragOver.bind(this));
                    tierElement.addEventListener('drop', this.handleDrop.bind(this));
                    tierElement.addEventListener('dragenter', this.handleDragEnter.bind(this));
                    tierElement.addEventListener('dragleave', this.handleDragLeave.bind(this));

                    tiersGrid.appendChild(tierElement);
                });
            }

            handleDragStart(e) {
                const quizId = e.target.dataset.quizId;
                e.dataTransfer.setData('text/plain', quizId);
                e.target.classList.add('dragging');
            }

            handleDragEnd(e) {
                e.target.classList.remove('dragging');
            }

            handleTierDragStart(e) {
                const quizId = e.target.dataset.quizId;
                const tierId = e.target.dataset.tierId;
                const position = e.target.dataset.position;
                
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    quizId: quizId,
                    sourceTierId: tierId,
                    sourcePosition: position,
                    type: 'tier-quiz'
                }));
                e.target.classList.add('dragging');
            }

            handleSlotDrop(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const targetTierId = parseInt(e.target.dataset.tierId);
                const targetPosition = parseInt(e.target.dataset.position);
                
                try {
                    const dragData = JSON.parse(e.dataTransfer.getData('text/plain'));
                    
                    if (dragData.type === 'tier-quiz') {
                        // Moving within or between tiers
                        this.moveQuizInTier(dragData.quizId, dragData.sourceTierId, targetTierId, targetPosition);
                    } else {
                        // Regular drop from pool
                        const quizId = e.dataTransfer.getData('text/plain');
                        this.moveQuizToTier(quizId, targetTierId);
                    }
                } catch (error) {
                    // Fallback for regular drops
                    const quizId = e.dataTransfer.getData('text/plain');
                    this.moveQuizToTier(quizId, targetTierId);
                }
                
                e.target.style.backgroundColor = '';
            }

            handleInternalDrop(e) {
                e.preventDefault();
                
                // Find the target quiz card or slot
                const target = e.target.closest('.quiz-card.in-tier') || e.target.closest('.empty-slot');
                if (!target) return;
                
                const targetTierId = parseInt(target.dataset.tierId);
                let targetPosition;
                
                if (target.classList.contains('quiz-card')) {
                    targetPosition = parseInt(target.dataset.position);
                } else {
                    targetPosition = parseInt(target.dataset.position);
                }
                
                try {
                    const dragData = JSON.parse(e.dataTransfer.getData('text/plain'));
                    
                    if (dragData.type === 'tier-quiz') {
                        this.moveQuizInTier(dragData.quizId, dragData.sourceTierId, targetTierId, targetPosition);
                    }
                } catch (error) {
                    // Ignore non-tier drags
                }
            }

            handleDragOver(e) {
                e.preventDefault();
            }

            handleDragEnter(e) {
                if (e.target.classList.contains('tier') || e.target.closest('.tier')) {
                    const tier = e.target.classList.contains('tier') ? e.target : e.target.closest('.tier');
                    tier.classList.add('drop-zone');
                }
            }

            handleDragLeave(e) {
                if (e.target.classList.contains('tier')) {
                    e.target.classList.remove('drop-zone');
                }
            }

            handleDrop(e) {
                e.preventDefault();
                const tier = e.target.classList.contains('tier') ? e.target : e.target.closest('.tier');
                tier.classList.remove('drop-zone');

                const quizId = e.dataTransfer.getData('text/plain');
                const tierId = parseInt(tier.dataset.tierId);
                
                this.moveQuizToTier(quizId, tierId);
            }

            moveQuizToTier(quizId, tierId) {
                // Remove quiz from current location
                this.tiers.forEach(tier => {
                    tier.quizzes = tier.quizzes.filter(quiz => quiz.internalId !== quizId);
                });

                // Find the quiz using internalId
                const quiz = this.quizzes.find(q => q.internalId === quizId);
                if (!quiz) return;

                // Add to new tier if not full
                const targetTier = this.tiers[tierId - 1];
                if (targetTier.quizzes.length < 5) {
                    targetTier.quizzes.push(quiz);
                    this.renderTiers();
                    this.renderQuizPool();
                    this.updateStats();
                } else {
                    this.showNotification('Tier is full (5 quizzes maximum)', true);
                }
            }

            moveQuizInTier(quizId, sourceTierId, targetTierId, targetPosition) {
                const sourceQuiz = this.findQuizInTiers(quizId);
                if (!sourceQuiz) return;

                // Remove from source tier
                this.tiers.forEach(tier => {
                    tier.quizzes = tier.quizzes.filter(quiz => quiz.internalId !== quizId);
                });

                // Add to target tier at specific position
                const targetTier = this.tiers[targetTierId - 1];
                if (targetTier) {
                    // Insert at specific position, or at end if position is beyond array
                    if (targetPosition < targetTier.quizzes.length) {
                        targetTier.quizzes.splice(targetPosition, 0, sourceQuiz);
                    } else {
                        targetTier.quizzes.push(sourceQuiz);
                    }
                    
                    // Ensure we don't exceed 5 quizzes per tier
                    if (targetTier.quizzes.length > 5) {
                        targetTier.quizzes = targetTier.quizzes.slice(0, 5);
                        this.showNotification('Tier is limited to 5 quizzes maximum', true);
                    }
                }

                this.renderTiers();
                this.renderQuizPool();
                this.updateStats();
            }

            findQuizInTiers(quizId) {
                for (const tier of this.tiers) {
                    const quiz = tier.quizzes.find(q => q.internalId === quizId);
                    if (quiz) return quiz;
                }
                return null;
            }

            removeQuizFromTier(quizId, tierId) {
                const tier = this.tiers[tierId - 1];
                if (tier) {
                    tier.quizzes = tier.quizzes.filter(quiz => quiz.internalId !== quizId);
                    this.renderTiers();
                    this.renderQuizPool();
                    this.updateStats();
                    this.showNotification('Quiz removed from tier');
                }
            }

            updateStats() {
                const totalQuizzes = this.quizzes.length;
                const assignedQuizzes = this.tiers.reduce((sum, tier) => sum + tier.quizzes.length, 0);
                const unassignedQuizzes = totalQuizzes - assignedQuizzes;
                const filledTiers = this.tiers.filter(tier => tier.quizzes.length === 5).length;

                document.getElementById('totalQuizzes').textContent = totalQuizzes;
                document.getElementById('assignedQuizzes').textContent = assignedQuizzes;
                document.getElementById('unassignedQuizzes').textContent = unassignedQuizzes;
                document.getElementById('filledTiers').textContent = filledTiers;
            }

            exportConfiguration() {
                const quizOrder = [];
                
                this.tiers.forEach((tier, tierIndex) => {
                    tier.quizzes.forEach((quiz, position) => {
                        quizOrder.push({
                            quiz_id: quiz.uniqueId, // Use unique ID to handle duplicates
                            original_id: quiz.originalId, // Keep original ID for reference
                            title: quiz.title,
                            tier: tierIndex + 1,
                            position: position + 1,
                            original_difficulty: quiz.difficulty
                        });
                    });
                });

                const config = { quiz_order: quizOrder };
                
                // Download the file
                const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'quiz_order_config.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showNotification(`Exported configuration with ${quizOrder.length} quiz assignments`);
            }

            autoFill() {
                if (this.quizzes.length === 0) {
                    this.showNotification('Please load quiz files first', true);
                    return;
                }

                if (confirm('Auto-fill all tiers with intelligent difficulty distribution?\nThis will clear existing assignments.')) {
                    // Clear existing assignments
                    this.tiers.forEach(tier => tier.quizzes = []);
                    
                    // Get all available quizzes
                    const availableQuizzes = [...this.quizzes];
                    
                    // Sort quizzes by difficulty (easier first) for initial distribution
                    availableQuizzes.sort((a, b) => (a.difficulty || 1) - (b.difficulty || 1));
                    
                    // Fill each tier
                    for (let tierIndex = 0; tierIndex < this.tiers.length; tierIndex++) {
                        if (availableQuizzes.length === 0) break;
                        
                        const tier = this.tiers[tierIndex];
                        const tierQuizzes = this.selectQuizzesForTier(availableQuizzes, tierIndex, 5);
                        
                        // Remove selected quizzes from available pool
                        tierQuizzes.forEach(selectedQuiz => {
                            const index = availableQuizzes.findIndex(q => q.internalId === selectedQuiz.internalId);
                            if (index !== -1) availableQuizzes.splice(index, 1);
                        });
                        
                        tier.quizzes = tierQuizzes;
                    }
                    
                    this.renderTiers();
                    this.renderQuizPool();
                    this.updateStats();
                    this.showNotification(`Auto-filled ${this.tiers.length} tiers with smart difficulty distribution`);
                }
            }

            autoComplete() {
                if (this.quizzes.length === 0) {
                    this.showNotification('Please load quiz files first', true);
                    return;
                }

                // Count empty slots
                let totalEmptySlots = 0;
                this.tiers.forEach(tier => {
                    totalEmptySlots += Math.max(0, 5 - tier.quizzes.length);
                });

                if (totalEmptySlots === 0) {
                    this.showNotification('All tiers are already complete!');
                    return;
                }

                if (confirm(`Auto-complete ${totalEmptySlots} empty slots while keeping existing assignments?\nThis will preserve your current quiz placements.`)) {
                    // Get currently assigned quizzes
                    const assignedIds = new Set();
                    this.tiers.forEach(tier => {
                        tier.quizzes.forEach(quiz => assignedIds.add(quiz.internalId));
                    });
                    
                    // Get available quizzes (excluding already assigned ones)
                    const availableQuizzes = this.quizzes.filter(quiz => !assignedIds.has(quiz.internalId));
                    
                    if (availableQuizzes.length === 0) {
                        this.showNotification('No unassigned quizzes available to complete tiers', true);
                        return;
                    }

                    // Sort available quizzes by difficulty for better distribution
                    availableQuizzes.sort((a, b) => (a.difficulty || 1) - (b.difficulty || 1));
                    
                    let slotsCompleted = 0;
                    const remainingQuizzes = [...availableQuizzes];
                    
                    // Complete each tier that has empty slots
                    for (let tierIndex = 0; tierIndex < this.tiers.length; tierIndex++) {
                        const tier = this.tiers[tierIndex];
                        const emptySlots = Math.max(0, 5 - tier.quizzes.length);
                        
                        if (emptySlots > 0 && remainingQuizzes.length > 0) {
                            const quizzesToAdd = this.selectQuizzesForTier(remainingQuizzes, tierIndex, emptySlots);
                            
                            // Remove selected quizzes from remaining pool
                            quizzesToAdd.forEach(selectedQuiz => {
                                const index = remainingQuizzes.findIndex(q => q.internalId === selectedQuiz.internalId);
                                if (index !== -1) remainingQuizzes.splice(index, 1);
                            });
                            
                            // Add to tier
                            tier.quizzes.push(...quizzesToAdd);
                            slotsCompleted += quizzesToAdd.length;
                        }
                        
                        if (remainingQuizzes.length === 0) break;
                    }
                    
                    this.renderTiers();
                    this.renderQuizPool();
                    this.updateStats();
                    this.showNotification(`Auto-completed ${slotsCompleted} slots while preserving existing assignments`);
                }
            }

            selectQuizzesForTier(availableQuizzes, tierIndex, count) {
                if (availableQuizzes.length === 0) return [];
                
                // Calculate tier difficulty progression (1-6 scale)
                const totalTiers = 96;
                const progressRatio = tierIndex / totalTiers;
                
                // Define difficulty ranges based on tier progression
                let preferredDifficulties, maxDifficultyForTier;
                if (progressRatio <= 0.2) {
                    // First 20% of tiers (1-19): prefer difficulty 1-2
                    preferredDifficulties = [1, 2];
                    maxDifficultyForTier = 2;
                } else if (progressRatio <= 0.4) {
                    // Next 20% (20-38): prefer difficulty 2-3
                    preferredDifficulties = [2, 3];
                    maxDifficultyForTier = 3;
                } else if (progressRatio <= 0.6) {
                    // Next 20% (39-57): prefer difficulty 3-4
                    preferredDifficulties = [3, 4];
                    maxDifficultyForTier = 4;
                } else if (progressRatio <= 0.8) {
                    // Next 20% (58-76): prefer difficulty 4-5
                    preferredDifficulties = [4, 5];
                    maxDifficultyForTier = 5;
                } else {
                    // Last 20% (77-96): prefer difficulty 5-6
                    preferredDifficulties = [5, 6];
                    maxDifficultyForTier = 6;
                }
                
                const selectedQuizzes = [];
                const remainingQuizzes = [...availableQuizzes];
                
                // First, select 4 quizzes preferring easier difficulties
                for (let i = 0; i < Math.min(count - 1, remainingQuizzes.length); i++) {
                    let selectedQuiz = null;
                    
                    // Try to find a quiz with preferred difficulty
                    const preferredQuizzes = remainingQuizzes.filter(q => 
                        preferredDifficulties.includes(q.difficulty || 1)
                    );
                    
                    if (preferredQuizzes.length > 0) {
                        // Randomly select from preferred quizzes
                        const randomIndex = Math.floor(Math.random() * preferredQuizzes.length);
                        selectedQuiz = preferredQuizzes[randomIndex];
                    } else {
                        // If no preferred quizzes available, pick any available quiz
                        const randomIndex = Math.floor(Math.random() * remainingQuizzes.length);
                        selectedQuiz = remainingQuizzes[randomIndex];
                    }
                    
                    if (selectedQuiz) {
                        selectedQuizzes.push(selectedQuiz);
                        const index = remainingQuizzes.findIndex(q => q.internalId === selectedQuiz.internalId);
                        remainingQuizzes.splice(index, 1);
                    }
                }
                
                // For the 5th quiz (boss level), ensure it has appropriate difficulty
                if (remainingQuizzes.length > 0 && selectedQuizzes.length < count) {
                    // Find quizzes with difficulty >= maxDifficultyForTier for the boss position
                    const bossQuizzes = remainingQuizzes.filter(q => 
                        (q.difficulty || 1) >= maxDifficultyForTier
                    );
                    
                    let bossQuiz = null;
                    if (bossQuizzes.length > 0) {
                        // Randomly select from appropriate boss quizzes
                        const randomIndex = Math.floor(Math.random() * bossQuizzes.length);
                        bossQuiz = bossQuizzes[randomIndex];
                    } else {
                        // If no appropriate boss quiz, pick the hardest available
                        const sortedByDifficulty = remainingQuizzes.sort((a, b) => 
                            (b.difficulty || 1) - (a.difficulty || 1)
                        );
                        bossQuiz = sortedByDifficulty[0];
                    }
                    
                    if (bossQuiz) {
                        selectedQuizzes.push(bossQuiz);
                    }
                }
                
                return selectedQuizzes;
            }

            clearAll() {
                if (confirm('Are you sure you want to clear all tier assignments?')) {
                    this.tiers.forEach(tier => tier.quizzes = []);
                    this.renderTiers();
                    this.renderQuizPool();
                    this.updateStats();
                    this.showNotification('All assignments cleared');
                }
            }

            showNotification(message, isError = false) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${isError ? 'error' : ''} show`;
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize the application
        let quizOrganizer;
        document.addEventListener('DOMContentLoaded', () => {
            quizOrganizer = new QuizOrganizer();
        });
    </script>
</body>
</html>
